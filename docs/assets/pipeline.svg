<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="270" viewBox="0 0 1280 270" role="img" aria-labelledby="t d">
  <title id="t">How an audit runs</title>
  <desc id="d">Five stages: fetch at a pinned commit inside the VM; static scan with own rules and five scanners; runtime scenario from the auto generator plus a contained LLM; runtime test in install, run and run-darwin phases with decoys and a network sinkhole; read-only LLM review that writes the verdict.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="270" rx="18" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="30" y="40" fill="#94a3b8" font-size="15" font-weight="600" letter-spacing="1.5">HOW AN AUDIT RUNS</text>

    <!-- arrows between cards -->
    <g stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
      <line x1="248" y1="147" x2="274" y2="147"/>
      <line x1="500" y1="147" x2="526" y2="147"/>
      <line x1="752" y1="147" x2="778" y2="147"/>
      <line x1="1004" y1="147" x2="1030" y2="147"/>
    </g>

    <!-- card template: x offsets 30, 282, 534, 786, 1038; width 212, height 180, top 58 -->
    <g fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12">
      <rect x="30" y="58" width="212" height="180" rx="14"/>
      <rect x="282" y="58" width="212" height="180" rx="14"/>
      <rect x="534" y="58" width="212" height="180" rx="14"/>
      <rect x="786" y="58" width="212" height="180" rx="14"/>
      <rect x="1038" y="58" width="212" height="180" rx="14" fill="#4ade80" fill-opacity="0.06" stroke="#4ade80" stroke-opacity="0.35"/>
    </g>

    <!-- step numbers -->
    <g font-size="13" font-weight="700" text-anchor="middle" fill="#0b1220">
      <circle cx="54" cy="82" r="13" fill="#38bdf8"/><text x="54" y="87">1</text>
      <circle cx="306" cy="82" r="13" fill="#38bdf8"/><text x="306" y="87">2</text>
      <circle cx="558" cy="82" r="13" fill="#38bdf8"/><text x="558" y="87">3</text>
      <circle cx="810" cy="82" r="13" fill="#38bdf8"/><text x="810" y="87">4</text>
      <circle cx="1062" cy="82" r="13" fill="#4ade80"/><text x="1062" y="87">5</text>
    </g>

    <!-- where it runs -->
    <g font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">
      <rect x="190" y="72" width="40" height="20" rx="10" fill="#38bdf8" fill-opacity="0.15"/><text x="210" y="86" fill="#7dd3fc">VM</text>
      <rect x="442" y="72" width="40" height="20" rx="10" fill="#38bdf8" fill-opacity="0.15"/><text x="462" y="86" fill="#7dd3fc">VM</text>
      <rect x="648" y="72" width="88" height="20" rx="10" fill="#a78bfa" fill-opacity="0.18"/><text x="692" y="86" fill="#c4b5fd">VM + HOST</text>
      <rect x="946" y="72" width="40" height="20" rx="10" fill="#38bdf8" fill-opacity="0.15"/><text x="966" y="86" fill="#7dd3fc">VM</text>
      <rect x="1190" y="72" width="48" height="20" rx="10" fill="#a78bfa" fill-opacity="0.18"/><text x="1214" y="86" fill="#c4b5fd">HOST</text>
    </g>

    <!-- icons -->
    <g fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(136 128)"><path d="M0 -18 V8 M-10 -2 L0 8 L10 -2 M-18 6 V16 H18 V6"/></g>
      <g transform="translate(388 128)"><rect x="-17" y="-20" width="26" height="34" rx="3"/><path d="M-11 -10 H3 M-11 -2 H0"/><circle cx="8" cy="8" r="9"/><path d="M15 15 L22 22"/></g>
      <g transform="translate(640 128)"><rect x="-18" y="-19" width="8" height="8" rx="2"/><rect x="-18" y="-5" width="8" height="8" rx="2"/><rect x="-18" y="9" width="8" height="8" rx="2"/><path d="M-3 -15 H18 M-3 -1 H18 M-3 13 H12"/></g>
      <g transform="translate(892 128)"><rect x="-22" y="-16" width="44" height="32" rx="4"/><path d="M-14 -5 L-7 0 L-14 5 M-3 6 H8"/></g>
      <g transform="translate(1144 128)" stroke="#4ade80"><path d="M0 -20 L16 -13 V0 C16 11 9 18 0 22 C-9 18 -16 11 -16 0 V-13 Z"/><path d="M-7 1 L-2 7 L8 -5"/></g>
    </g>

    <!-- titles -->
    <g font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
      <text x="136" y="178">Fetch</text>
      <text x="388" y="178">Static scan</text>
      <text x="640" y="178">Scenario</text>
      <text x="892" y="178">Runtime test</text>
      <text x="1144" y="178">Review</text>
    </g>
    <!-- subtitles -->
    <g font-size="13.5" fill="#94a3b8" text-anchor="middle">
      <text x="136" y="202">pinned commit,</text><text x="136" y="220">unpacked in the VM</text>
      <text x="388" y="202">own rules + 5 scanners,</text><text x="388" y="220">no network</text>
      <text x="640" y="202">auto + contained LLM,</text><text x="640" y="220">README read as data</text>
      <text x="892" y="202">install · run · run-darwin</text><text x="892" y="220">decoys, sinkhole, strace</text>
      <text x="1144" y="202">read-only LLM,</text><text x="1144" y="220">verdict + precautions</text>
    </g>
  </g>
</svg>
