<svg xmlns="http://www.w3.org/2000/svg" width="920" height="728" viewBox="0 0 920 728" role="img" aria-labelledby="t d">
  <title id="t">How an audit runs</title>
  <desc id="d">1. Fetch (VM): Downloads the target at a pinned commit, inside the VM. Git never parses it on the host; symlinks are stripped on export. 2. Static scan (VM): Own rules plus gitleaks, osv-scanner, semgrep, SkillSpector, Cisco. Runs as a user with no network; never executes target code. 3. Scenario (VM + HOST): Writes install.sh and run.sh: how a user would install and use it. Generic baseline plus a contained LLM that reads the README as data. 4. Runtime test (VM): Runs the scenario: install, run, and run-darwin (told it is a Mac). Decoy credentials, network sinkhole, strace, persistence diff. 5. Review (HOST): A read-only LLM checks code against both summaries. Writes the report: verdict, top risks, precautions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity="0.05"/></pattern>
  </defs>
  <rect width="920" height="728" rx="18" fill="url(#bg)"/>
  <rect width="920" height="728" rx="18" fill="url(#grid)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="36" y="44" fill="#475569" font-size="15" font-weight="600" letter-spacing="1.5">HOW AN AUDIT RUNS</text>
    <rect x="24" y="70" width="872" height="108" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="#0f172a" stroke-opacity="0.18"/>
    <circle cx="62" cy="124" r="16" fill="#0284c7"/><text x="62" y="130" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <g transform="translate(128 124)"><g fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -18 V8 M-10 -2 L0 8 L10 -2 M-18 6 V16 H18 V6"/></g></g>
    <text x="176" y="110" fill="#0f172a" font-size="22" font-weight="700">Fetch</text>
    <text x="176" y="136" fill="#1e293b" font-size="16">Downloads the target at a pinned commit, inside the VM.</text>
    <text x="176" y="159" fill="#475569" font-size="15">Git never parses it on the host; symlinks are stripped on export.</text>
    <rect x="837" y="90" width="43" height="24" rx="12" fill="#0284c7" fill-opacity="0.16"/><text x="859" y="107" fill="#0369a1" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">VM</text>
    <path d="M62 182 V196 M56 190 L62 196 L68 190" stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="200" width="872" height="108" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="#0f172a" stroke-opacity="0.18"/>
    <circle cx="62" cy="254" r="16" fill="#0284c7"/><text x="62" y="260" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <g transform="translate(128 254)"><g fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-17" y="-20" width="26" height="34" rx="3"/><path d="M-11 -10 H3 M-11 -2 H0"/><circle cx="8" cy="8" r="9"/><path d="M15 15 L22 22"/></g></g>
    <text x="176" y="240" fill="#0f172a" font-size="22" font-weight="700">Static scan</text>
    <text x="176" y="266" fill="#1e293b" font-size="16">Own rules plus gitleaks, osv-scanner, semgrep, SkillSpector, Cisco.</text>
    <text x="176" y="289" fill="#475569" font-size="15">Runs as a user with no network; never executes target code.</text>
    <rect x="837" y="220" width="43" height="24" rx="12" fill="#0284c7" fill-opacity="0.16"/><text x="859" y="237" fill="#0369a1" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">VM</text>
    <path d="M62 312 V326 M56 320 L62 326 L68 320" stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="330" width="872" height="108" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="#0f172a" stroke-opacity="0.18"/>
    <circle cx="62" cy="384" r="16" fill="#0284c7"/><text x="62" y="390" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <g transform="translate(128 384)"><g fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-18" y="-19" width="8" height="8" rx="2"/><rect x="-18" y="-5" width="8" height="8" rx="2"/><rect x="-18" y="9" width="8" height="8" rx="2"/><path d="M-3 -15 H18 M-3 -1 H18 M-3 13 H12"/></g></g>
    <text x="176" y="370" fill="#0f172a" font-size="22" font-weight="700">Scenario</text>
    <text x="176" y="396" fill="#1e293b" font-size="16">Writes install.sh and run.sh: how a user would install and use it.</text>
    <text x="176" y="419" fill="#475569" font-size="15">Generic baseline plus a contained LLM that reads the README as data.</text>
    <rect x="797" y="350" width="83" height="24" rx="12" fill="#7c3aed" fill-opacity="0.16"/><text x="838" y="367" fill="#6d28d9" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">VM + HOST</text>
    <path d="M62 442 V456 M56 450 L62 456 L68 450" stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="460" width="872" height="108" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="#0f172a" stroke-opacity="0.18"/>
    <circle cx="62" cy="514" r="16" fill="#0284c7"/><text x="62" y="520" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">4</text>
    <g transform="translate(128 514)"><g fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-22" y="-16" width="44" height="32" rx="4"/><path d="M-14 -5 L-7 0 L-14 5 M-3 6 H8"/></g></g>
    <text x="176" y="500" fill="#0f172a" font-size="22" font-weight="700">Runtime test</text>
    <text x="176" y="526" fill="#1e293b" font-size="16">Runs the scenario: install, run, and run-darwin (told it is a Mac).</text>
    <text x="176" y="549" fill="#475569" font-size="15">Decoy credentials, network sinkhole, strace, persistence diff.</text>
    <rect x="837" y="480" width="43" height="24" rx="12" fill="#0284c7" fill-opacity="0.16"/><text x="859" y="497" fill="#0369a1" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">VM</text>
    <path d="M62 572 V586 M56 580 L62 586 L68 580" stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="590" width="872" height="108" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="#16a34a" stroke-opacity="0.45"/>
    <circle cx="62" cy="644" r="16" fill="#16a34a"/><text x="62" y="650" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">5</text>
    <g transform="translate(128 644)"><g fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -20 L16 -13 V0 C16 11 9 18 0 22 C-9 18 -16 11 -16 0 V-13 Z"/><path d="M-7 1 L-2 7 L8 -5"/></g></g>
    <text x="176" y="630" fill="#0f172a" font-size="22" font-weight="700">Review</text>
    <text x="176" y="656" fill="#1e293b" font-size="16">A read-only LLM checks code against both summaries.</text>
    <text x="176" y="679" fill="#475569" font-size="15">Writes the report: verdict, top risks, precautions.</text>
    <rect x="828" y="610" width="52" height="24" rx="12" fill="#7c3aed" fill-opacity="0.16"/><text x="854" y="627" fill="#6d28d9" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">HOST</text>
  </g>
</svg>
