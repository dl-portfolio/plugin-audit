<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
  <title id="t">plugin-audit</title>
  <desc id="d">Supply-chain vetting for AI agent extensions: throwaway VM, decoy credentials, network sinkhole, macOS impersonation, contained LLM review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="18" fill="url(#grid)"/>

  <!-- shield + magnifier -->
  <g transform="translate(150 150)">
    <path d="M0 -94 L76 -64 V-2 C76 48 42 82 0 100 C-42 82 -76 48 -76 -2 V-64 Z"
          fill="url(#shield)" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="-8" cy="-6" r="32" fill="none" stroke="#f8fafc" stroke-width="9"/>
    <path d="M-22 -6 L-12 5 L8 -16" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 18 L42 44" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="290" y="112" fill="#f8fafc" font-size="62" font-weight="700" letter-spacing="-1">plugin-audit</text>
    <text x="292" y="156" fill="#cbd5e1" font-size="26">Supply-chain vetting for AI agent extensions</text>
    <text x="292" y="190" fill="#94a3b8" font-size="18">Claude Code plugins · skills · MCP servers · CLI tools · libraries</text>

    <g font-size="15" fill="#e2e8f0" text-anchor="middle">
      <rect x="290" y="216" width="134" height="34" rx="17" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text x="357" y="238">Throwaway VM</text>
      <rect x="436" y="216" width="168" height="34" rx="17" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text x="520" y="238">Decoy credentials</text>
      <rect x="616" y="216" width="160" height="34" rx="17" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text x="696" y="238">Network sinkhole</text>
      <rect x="788" y="216" width="186" height="34" rx="17" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text x="881" y="238">macOS impersonation</text>
      <rect x="986" y="216" width="196" height="34" rx="17" fill="#4ade80" fill-opacity="0.10" stroke="#4ade80" stroke-opacity="0.45"/>
      <text x="1084" y="238">Contained LLM review</text>
    </g>
  </g>
</svg>
