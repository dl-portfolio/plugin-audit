# Lima template for the audit VM. Built once into "audit-base", never run against targets;
# every audit runs in a throwaway clone (see ../audit.sh).
# Isolation: no host folders, no port forwarding, no containerd, no SSH agent, no host SSH keys.
vmType: vz
os: Linux
arch: aarch64
cpus: 4
memory: 6GiB
disk: 60GiB
images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64
    digest: "sha256:50e24e1fb79e89116e939d90aa7738f7af48c442fa1bc2510131e0b39c50348e"
plain: true          # disables mounts, port forwarding and containerd
mounts: []
containerd:
  system: false
  user: false
ssh:
  forwardAgent: false
  forwardX11: false
  loadDotSSHPubKeys: false
